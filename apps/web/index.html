<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudGuard</title>
    <!--
      The theme, before the first paint.

      React cannot do this: by the time it mounts, the browser has already
      painted a white page, and correcting it afterwards is a flash of light in
      a dark room. Kept deliberately small -- the key, the class and the
      fallback are the same ones in src/lib/theme.ts, and a test compares them.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("cloudguard-theme");
          var choice = stored === "light" || stored === "dark" ? stored : "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* No storage, no preference read: the light default already applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
