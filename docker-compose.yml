name: cloudguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: cloudguard
      POSTGRES_DB: cloudguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /srv/apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/srv/apps/api
      - ./database:/srv/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /srv/apps/api
    volumes:
      - ./apps/api:/srv/apps/api
      - ./database:/srv/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=2

  web:
    image: node:22-alpine
    working_dir: /srv/web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/srv/web
      - webnodemodules:/srv/web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  webnodemodules:
